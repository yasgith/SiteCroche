<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/formulario.css">
    <title>LOGIN</title>
</head>

<body>
    <button onclick="history.back()" class="voltar">Voltar</button>

    <!-- INICIO FORMULARIO LOGIN -->
    <div class="formulario">
        <h1>LOGIN</h1>
        <form action="#">
            <div class="grupo-form">
                <input type="text" placeholder="E-mail" required>
                <i class='bx bxs-user'></i>
            </div>

            <div class="grupo-form">
                <input type="password" placeholder="Senha" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="caixa-lem">
                <label><input type="checkbox">Lembrar-me</label>
                <a href="esquecisenha.html">Esqueci minha senha</a>
            </div>

            <button class="botao-cad" type="submit">
                <a href="index.html" class="botao-link">Entrar</a>
            </button>
            <div class="link-regis">
                <p>Não possui cadastro? <a href="cadastro.html">Cadastra-se!</a> </p>
            </div>
        </form>
    </div>
    <!-- FIM FORMULARIO LOGIN -->
</body>

</html>
